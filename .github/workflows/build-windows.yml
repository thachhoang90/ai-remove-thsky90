name: Build Windows installer

on:
  # Releases -> Draft a new release -> new tag v1.0.0 -> Publish:
  # the installer is built and attached to that release automatically.
  release:
    types: [published]
  # Or run it by hand from the Actions tab (result: downloadable artifact).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis gcc-mingw-w64-x86-64 zip unzip
      - name: Build bundle + installer
        run: bash packaging/windows/build_on_linux.sh "$RUNNER_TEMP/cache" dist
      - uses: actions/upload-artifact@v6
        with:
          name: AI-Remove-thsky90-windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Attach files to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.exe
            dist/*.zip
