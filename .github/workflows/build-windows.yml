name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis gcc-mingw-w64-x86-64 zip unzip
      - name: Build bundle + installer
        run: bash packaging/windows/build_on_linux.sh "$RUNNER_TEMP/cache" dist
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Remove-thsky90-windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
